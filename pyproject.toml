[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pycapital"
version = "0.1.0"
description = "Unified, validated access to NSE, BSE, AMFI and SEBI data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=1.5", "requests>=2.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["live: hits real NSE/BSE servers"]